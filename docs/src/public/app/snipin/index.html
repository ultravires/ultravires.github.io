  <meta name="description" content="Snipin 是一款用 Swift 与 macOS 原生 API 打造的轻量截屏工具，支持区域截图、窗口截图、滚动截图、标注、OCR 与取色。">

    </div>

    <div class="wrap">
      <section class="hero">
